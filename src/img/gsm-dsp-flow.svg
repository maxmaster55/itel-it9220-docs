<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d">
<title id="t">GSM DSP queue and mailbox flow</title>
<desc id="d">How the AP's layer 1 control feeds the CEVA GSM DSP one frame instruction per TDMA frame through the FrameInst queue in the dual-port area, and how responses come back through RespQ and the mailbox interrupt.</desc>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.mu{fill:#59636e}
.b{font-weight:600}
.h{font-size:20px;font-weight:700}
.sub{font-size:13px;fill:#59636e}</style>
<defs><marker id="a0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#0969da"/></marker><marker id="a8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8250df"/></marker><marker id="a9a6700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9a6700"/></marker></defs>
<rect width="960" height="640" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="36" font-size="20" class="h">GSM DSP: queues and mailbox</text>
<text x="24" y="56" font-size="13" class="sub">One frame instruction per TDMA frame (4.615 ms). The mailbox only wakes the other side; the data is in the queues.</text>
<text x="24" y="92" font-size="14" class="b" style="fill:#0969da">AP (Cortex-A7), stock KernelImg</text>
<rect x="24" y="104" width="290" height="50" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="36" y="125" font-size="14" class="b" style="fill:#0969da">Layers 2/3</text>
<text x="36" y="143" font-size="12">RR, MM, CC, SMS</text>
<rect x="24" y="178" width="290" height="68" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="36" y="199" font-size="14" class="b" style="fill:#0969da">Layer 1 control (frame engine)</text>
<text x="36" y="217" font-size="12">layer-1 task (task id <tspan class="m">0x5D</tspan>)</text>
<text x="36" y="234" font-size="12">fills FrameInst in batches</text>
<rect x="24" y="300" width="290" height="68" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="36" y="321" font-size="14" class="b" style="fill:#0969da">HISR  (<tspan class="m">dspintisr.c</tspan>)</text>
<text x="36" y="339" font-size="12">reads RespQ until empty, posts</text>
<text x="36" y="356" font-size="12">signals to the layer-1 task</text>
<rect x="24" y="392" width="290" height="68" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="36" y="413" font-size="14" class="b" style="fill:#0969da">Mailbox ISR  (outbox, SPI 69)</text>
<text x="36" y="431" font-size="12">only empties the outbox</text>
<text x="36" y="448" font-size="12">then queues the HISR</text>
<path d="M169,154 L169,177" fill="none" stroke="#0969da" stroke-width="1.5" marker-end="url(#a0969da)" marker-start="url(#a0969da)"/>
<path d="M169,392 L169,369" fill="none" stroke="#0969da" stroke-width="1.5" marker-end="url(#a0969da)"/>
<path d="M169,300 L169,247" fill="none" stroke="#0969da" stroke-width="1.5" marker-end="url(#a0969da)"/>
<text x="177" y="278" font-size="12" class="mu">signals</text>
<text x="350" y="92" font-size="14" class="b" style="fill:#8250df">Dual-port area <tspan class="m">0x00010C00</tspan></text>
<rect x="350" y="104" width="260" height="356" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.2"/>
<text x="362" y="126" font-size="13" class="b">FrameInst  <tspan class="m">+0x000</tspan></text>
<text x="362" y="143" font-size="12">26 slots x 36 bytes, AP writes</text>
<rect x="362" y="154" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="380.154" y="154" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="398.308" y="154" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="416.462" y="154" width="15.1538" height="16" rx="2" fill="#d8b9ff" stroke="#8250df"/>
<rect x="434.615" y="154" width="15.1538" height="16" rx="2" fill="#d8b9ff" stroke="#8250df"/>
<rect x="452.769" y="154" width="15.1538" height="16" rx="2" fill="#d8b9ff" stroke="#8250df"/>
<rect x="470.923" y="154" width="15.1538" height="16" rx="2" fill="#d8b9ff" stroke="#8250df"/>
<rect x="489.077" y="154" width="15.1538" height="16" rx="2" fill="#d8b9ff" stroke="#8250df"/>
<rect x="507.231" y="154" width="15.1538" height="16" rx="2" fill="#d8b9ff" stroke="#8250df"/>
<rect x="525.385" y="154" width="15.1538" height="16" rx="2" fill="#d8b9ff" stroke="#8250df"/>
<rect x="543.538" y="154" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df" stroke-dasharray="3 2"/>
<rect x="561.692" y="154" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="579.846" y="154" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="362" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="380.154" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="398.308" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="416.462" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="434.615" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="452.769" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="470.923" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="489.077" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="507.231" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="525.385" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="543.538" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="561.692" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="579.846" y="174" width="15.1538" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<text x="362" y="212" font-size="12">read index <tspan class="m">+0x3A8</tspan> (DSP)</text>
<text x="362" y="228" font-size="12">write index <tspan class="m">+0x3AA</tspan> (AP)</text>
<text x="362" y="244" font-size="12" class="mu">one slot always stays free</text>
<line x1="362" y1="262" x2="598" y2="262" stroke="#d0d7de"/>
<text x="362" y="284" font-size="13" class="b">Command queue  <tspan class="m">+0x70C</tspan></text>
<text x="362" y="301" font-size="12">8 slots x 12 bytes, AP to DSP</text>
<line x1="362" y1="318" x2="598" y2="318" stroke="#d0d7de"/>
<text x="362" y="340" font-size="13" class="b">RespQ  <tspan class="m">+0x770</tspan></text>
<text x="362" y="357" font-size="12">8 slots x 12 bytes, DSP writes</text>
<rect x="362" y="368" width="26" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="392" y="368" width="26" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="422" y="368" width="26" height="16" rx="2" fill="#d8b9ff" stroke="#8250df"/>
<rect x="452" y="368" width="26" height="16" rx="2" fill="#d8b9ff" stroke="#8250df"/>
<rect x="482" y="368" width="26" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="512" y="368" width="26" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="542" y="368" width="26" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<rect x="572" y="368" width="26" height="16" rx="2" fill="#ffffff" stroke="#8250df"/>
<text x="362" y="402" font-size="12">read <tspan class="m">+0x7D0</tspan> (AP) / write <tspan class="m">+0x7D2</tspan> (DSP)</text>
<text x="362" y="420" font-size="12" class="mu">low byte = response number,</text>
<text x="362" y="436" font-size="12" class="mu">then four 16-bit parameters</text>
<text x="646" y="92" font-size="14" class="b" style="fill:#9a6700">GSM DSP (CEVA TeakLite-4)</text>
<rect x="646" y="104" width="290" height="86" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
<text x="658" y="125" font-size="14" class="b" style="fill:#9a6700">Physical layer</text>
<text x="658" y="143" font-size="12">executes one instruction per frame</text>
<text x="658" y="160" font-size="12">kinds seen: 0 idle, 11 power</text>
<text x="658" y="177" font-size="12">measurement (up to 6 carriers)</text>
<rect x="646" y="300" width="290" height="68" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
<text x="658" y="321" font-size="14" class="b" style="fill:#9a6700">Results</text>
<text x="658" y="339" font-size="12">writes RespQ, then raises the</text>
<text x="658" y="356" font-size="12">mailbox (core 2) to the AP</text>
<rect x="646" y="392" width="290" height="68" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.2"/>
<text x="658" y="413" font-size="14" class="b" style="fill:#8250df">Mailbox  <tspan class="m">0x400A0000</tspan> / <tspan class="m">0x400A8000</tspan></text>
<text x="658" y="431" font-size="12">AP to DSP: ID 2, TRIGGER 1</text>
<text x="658" y="448" font-size="12">DSP to AP: outbox interrupt, SPI 69</text>
<path d="M314,212 L349,212" fill="none" stroke="#0969da" stroke-width="1.5" marker-end="url(#a0969da)"/>
<text x="320" y="204" font-size="12" class="mu">write</text>
<path d="M610,170 L645,150" fill="none" stroke="#9a6700" stroke-width="1.5" marker-end="url(#a9a6700)"/>
<text x="616" y="150" font-size="12" class="mu">read</text>
<path d="M646,334 L611,360" fill="none" stroke="#9a6700" stroke-width="1.5" marker-end="url(#a9a6700)"/>
<text x="616" y="334" font-size="12" class="mu">write</text>
<path d="M349,376 L315,340" fill="none" stroke="#8250df" stroke-width="1.5" marker-end="url(#a8250df)"/>
<text x="320" y="374" font-size="12" class="mu">read</text>
<path d="M791,368 L791,391" fill="none" stroke="#9a6700" stroke-width="1.5" marker-end="url(#a9a6700)"/>
<path d="M791,461 L791,482 L332,482 L332,426 L315,426" fill="none" stroke="#8250df" stroke-width="1.5" marker-end="url(#a8250df)"/>
<text x="474" y="498" font-size="12" class="mu" text-anchor="middle">interrupt, line 69</text>
<rect x="24" y="516" width="440" height="102" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="1.2"/>
<text x="36" y="537" font-size="14" class="b" style="fill:#8250df">Shared DRAM blocks</text>
<text x="36" y="555" font-size="12">A <tspan class="m">0x80100000</tspan> (<tspan class="m">0x20000</tspan>): parameters; ready word: AP 1, DSP 2</text>
<text x="36" y="572" font-size="12">B <tspan class="m">0x803A8000</tspan>: voice PCM rings (formats guessed)</text>
<text x="36" y="589" font-size="12">image at <tspan class="m">0x80120000</tspan>, boot vector = byte address / 2</text>
<rect x="484" y="516" width="452" height="102" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/>
<text x="496" y="537" font-size="14" class="b" style="fill:#cf222e">Deadline: 1 to 3 TDMA frames (4.6 to 13.8 ms)</text>
<text x="496" y="555" font-size="12">from the DSP's interrupt to new instructions in the queue</text>
<text x="496" y="572" font-size="12">a miss is fatal in stock: "L1:dsp overrun", "FrameInst full!",</text>
<text x="496" y="589" font-size="12"><tspan class="m">dsp assert 0x1c20</tspan> on a loaded host</text>
</svg>
